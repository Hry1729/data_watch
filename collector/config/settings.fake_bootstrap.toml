[runtime]
log_level = "INFO"
enable_fake_bootstrap = true

[mysql]
host = "127.0.0.1"
port = 3306
user = "root"
password = "password"
database = "device_watch"
charset = "utf8mb4"
pool_size = 10
max_overflow = 20
pool_timeout = 30
pool_recycle = 3600

[interface_ingest]
enabled = true
host = "0.0.0.0"
port = 8090
path = "/ingest"
api_key = ""
max_batch_size = 1000
