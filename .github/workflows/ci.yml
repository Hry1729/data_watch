# Linux 基础 CI（HURY-6）。
# 运行 frontend、cli，以及不依赖 Rust / Tauri 系统库的桌面端 JS 测试和构建。
# 不运行 backend：它需要 Windows 和 free-threaded Python 3.14t。
# 不运行 app/src-tauri 的 cargo check。依赖 Windows 的 CLI 用例由测试自行跳过。

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm --dir ./frontend install --frozen-lockfile

      - name: Test
        run: pnpm --dir ./frontend test

      - name: Build
        run: pnpm --dir ./frontend build

  cli:
    name: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cli/requirements.txt

      - name: Install
        run: python -m pip install -r cli/requirements.txt pytest

      - name: Test
        run: python -m pytest cli/tests -q

  desktop:
    name: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install
        run: pnpm --dir ./app install --frozen-lockfile

      - name: Test
        run: pnpm --dir ./app test

      - name: Build
        run: pnpm --dir ./app build
