# Linux 基础 CI（HURY-6）。
# 运行 frontend、cli，以及不依赖 Rust / Tauri 系统库的桌面端 JS 测试和构建。
# backend job（HURY-20）：ubuntu 上用 free-threaded Python 3.14t 跑 backend/app/tests。
# 不运行 app/src-tauri 的 cargo check。
# 依赖 Windows 的 CLI 用例在 cli-windows（windows-latest，Python 3.14t）里跑。
# ingest job（HURY-16）：用 buildx 编 free-threaded 3.14t，再编 ingest，并做 workers=2 冒烟。

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm --dir ./frontend install --frozen-lockfile

      - name: Test
        run: pnpm --dir ./frontend test

      - name: Build
        run: pnpm --dir ./frontend build

  cli:
    name: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cli/requirements.txt

      - name: Install
        run: python -m pip install -r cli/requirements.txt pytest

      - name: Test
        run: python -m pytest cli/tests direct_read/tests -q

  desktop:
    name: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install
        run: pnpm --dir ./app install --frozen-lockfile

      - name: Test
        run: pnpm --dir ./app test

      - name: Build
        run: pnpm --dir ./app build

  cli-windows:
    name: cli-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14t"

      - name: Install
        run: python -m pip install -r cli/requirements.txt pytest

      - name: Test
        run: python -m pytest cli/tests direct_read/tests -q --tb=short --junitxml=junit-cli-windows.xml

      - name: Require the Windows tests to run
        run: python -c "import xml.etree.ElementTree as ET; root=ET.parse('junit-cli-windows.xml').getroot(); suite=root if root.tag=='testsuite' else root.find('testsuite'); tests=int(suite.attrib.get('tests') or 0); skipped=int(suite.attrib.get('skipped') or 0); failed=int(suite.attrib.get('failures') or 0)+int(suite.attrib.get('errors') or 0); print('tests=%s skipped=%s failures=%s' % (tests, skipped, failed)); assert skipped==0 and failed==0 and tests>=179, (tests, skipped, failed)"

  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14t"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # 自由线程 3.14 不接受 abi3 wheel。这两个包目前只有 abi3，没有 cp314t wheel。
          # 测试导入期用不到：taosws 惰性导入，perspective 按需探测。
          grep -Ev '^(taos-ws-py|perspective-python)([<>=!~ ].*)?$' backend/requirements.txt > "$RUNNER_TEMP/backend-requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/backend-requirements.txt" pytest pytest-asyncio

      - name: Drop Windows-only site-packages
        # backend/main.py 会把该目录插到 sys.path 最前；里面是 win_amd64 扩展，Linux 上会把 cryptography 导崩。
        run: rm -rf backend/.py314t-site

      - name: Test
        working-directory: backend
        env:
          PYTHON_GIL: "0"
        run: python -Xgil=0 -m pytest app/tests -q --tb=short

  # edge 在此之前没有任何 CI 覆盖，HURY-18 的令牌角色回归因此漏到了 main。
  # 测试自己会把 REPO_ROOT 和 collector/ 插进 sys.path，所以按仓库根目录运行。
  edge:
    name: edge (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # CI 里符号链接用例必须真跑，"没有权限"不允许静默跳过。
      # Windows runner 是管理员账户；Linux runner 无需额外权限。
      DATAWATCH_REQUIRE_SYMLINK_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14t"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r edge/requirements.txt pytest pytest-asyncio

      - name: Self-check missing key id fails
        run: python -m pytest .github/scripts/test_assert_key_tests.py -q

      - name: Test
        run: python -m pytest edge/tests -q --tb=short --junitxml=junit-edge.xml

      # 不再写死跳过总数和用例总数。按平台核对关键 node id 是否真的执行。
      - name: Require the key edge tests to run
        run: python .github/scripts/assert_key_tests.py junit-edge.xml

  ingest:
    name: ingest
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ciingest
          MYSQL_DATABASE: device_watch
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pciingest --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build free-threaded Python 3.14t
        uses: docker/build-push-action@v6
        with:
          context: deploy
          file: deploy/python314t.Dockerfile
          tags: data-watch-python314t:3.14t-3.14.4
          load: true
          provenance: false
          cache-from: type=gha,scope=python314t
          cache-to: type=gha,mode=max,scope=python314t,ignore-error=true

      - name: Build ingest
        run: |
          docker build \
            --build-arg BASE_IMAGE=data-watch-python314t:3.14t-3.14.4 \
            -f ingest/Dockerfile \
            -t data-watch-ingest:ci .

      - name: Assert GIL stays off
        run: |
          docker run --rm data-watch-ingest:ci \
            python3.14t -c "import os, sys; assert os.environ.get('PYTHON_GIL') == '0'; assert not sys._is_gil_enabled(), sys._is_gil_enabled()"

      - name: Prepare MySQL tables required by schema warm-up
        run: |
          docker run --rm --network host \
            -e MYSQL_HOST=127.0.0.1 \
            -e MYSQL_PORT=3306 \
            -e MYSQL_USER=root \
            -e MYSQL_PASSWORD=ciingest \
            -e MYSQL_DATABASE=device_watch \
            data-watch-ingest:ci \
            python3.14t /app/ingest/ci/smoke_upload.py prepare

      - name: Enable Redis AOF (ingest requires Redis >= 7.2 with appendonly)
        run: |
          set -euo pipefail
          rc() { docker run --rm --network host redis:7.4 redis-cli -h 127.0.0.1 "$@"; }
          rc CONFIG SET appendonly yes
          for i in $(seq 1 30); do
            if rc INFO persistence | grep -q '^aof_enabled:1' && rc INFO persistence | grep -q '^aof_rewrite_in_progress:0'; then
              echo "AOF enabled"; exit 0
            fi
            sleep 1
          done
          echo "AOF not enabled in time"; rc INFO persistence; exit 1

      - name: Start ingest with two workers
        run: |
          docker run -d --name data-watch-ingest-ci --network host \
            -e INGEST_WORKERS=2 \
            -e INGEST_HOST=0.0.0.0 \
            -e INGEST_PORT=8010 \
            -e MYSQL_HOST=127.0.0.1 \
            -e MYSQL_PORT=3306 \
            -e MYSQL_USER=root \
            -e MYSQL_PASSWORD=ciingest \
            -e MYSQL_DATABASE=device_watch \
            -e INGEST_REDIS_URL=redis://127.0.0.1:6379/0 \
            data-watch-ingest:ci

      - name: Smoke schema warm-up, healthz, and one upload ACK
        run: |
          set -euo pipefail
          if ! docker run --rm --network host \
            -e MYSQL_HOST=127.0.0.1 \
            -e MYSQL_PORT=3306 \
            -e MYSQL_USER=root \
            -e MYSQL_PASSWORD=ciingest \
            -e MYSQL_DATABASE=device_watch \
            -e INGEST_REDIS_URL=redis://127.0.0.1:6379/0 \
            -e INGEST_URL=http://127.0.0.1:8010 \
            data-watch-ingest:ci \
            python3.14t /app/ingest/ci/smoke_upload.py verify
          then
            docker logs data-watch-ingest-ci || true
            exit 1
          fi
          docker logs data-watch-ingest-ci > /tmp/ingest-ci.log 2>&1
          grep -q "Started parent process" /tmp/ingest-ci.log
          test "$(grep -c "Application startup complete" /tmp/ingest-ci.log)" -eq 2
