<script>
function svgSource(){const svg=document.getElementById("diagram");const clone=svg.cloneNode(true);

function downloadBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);
a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)}
function downloadSVG(){downloadBlob(new Blob([svgSource()],{type:"image/svg+xml;charset=utf-8"}),document.title+".svg")}
function downloadPNG(){const source=svgSource();const url=URL.createObjectURL(new Blob([source],{type:"image/svg+xml;charset=utf-8"}));
const image=new Image();image.onload=function(){const canvas=document.createElement("canvas");canvas.width=3200;
canvas.height=1800;const ctx=canvas.getContext("2d");ctx.drawImage(image,0,0,canvas.width,canvas.height);
URL.revokeObjectURL(url);canvas.toBlob(function(blob){downloadBlob(blob,document.title+".png")},"image/png")};image.src=url}
function toggleTheme(){document.getElementById("diagram").classList.toggle("dark")}
