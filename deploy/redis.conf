# DataWatch Redis 配置（bind-mount 到容器 /usr/local/etc/redis/redis.conf）
# 把内存保险丝与持久化策略固化进仓库，容器误删/重建后配置可一致复现。

# 数据目录 = 命名卷 redis_data，RDB 落在这里，容器重建数据不丢。
dir /data

# 内存硬上限（保险丝）：12G 虚机下留足 TDengine/系统余量。
# 持久接收路径不按 MAXLEN 删除未消费数据；这里限制内存字节数。
# 撞到上限时按 noeviction 直接拒写并报错——绝不静默淘汰实时监控数据，
# 也绝不再吃光虚机把 TDengine 一起拖崩。写失败时检查 Writer 积压、磁盘与可用容量。
maxmemory 3gb
maxmemory-policy noeviction

# RDB 持久化规则（沿用 redis 默认值，显式写出便于复现）。
save 3600 1 300 100 60 10000
dbfilename dump.rdb
# Redis 7.2+：接收端在 ACK 前用 WAITAOF 等待本地 AOF fsync。
# everysec 本身不是零丢失承诺；不支持持久确认时上游保留队列重试。
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
# BGSAVE 失败时停止写入——防止磁盘写满/损坏后继续丢数据，redis 默认即此值，显式固化。
stop-writes-on-bgsave-error yes
