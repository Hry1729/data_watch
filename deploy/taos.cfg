# DataWatch TDengine 服务端配置（bind-mount 到容器 /etc/taos/taos.cfg）
# 仅覆盖以下三项，其余沿用 TDengine 默认。配合数据库 KEEP（见 writer/init 脚本）控制磁盘占用。

# TDengine 服务日志最多保留 4 天，超期自动删除（防 /var/log/taos 堆积）。
logKeepDays 4

# 数据目录(/var/lib/taos)可用空间低于 50GB 即停止写入——最后防线，防写爆磁盘导致损坏。
minimalDataDirGB 50

# 同步(sync)模块日志降为仅 error+warning（131），压掉启动恢复期 "C SYN ... sync barrier/restore" 刷屏。
sDebugFlag 131
