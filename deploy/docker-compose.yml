name: data_watch

services:
  redis:
    image: redis:latest
    container_name: data-watch-redis
    profiles:
      - infra
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped

  tdengine:
    image: tdengine/tsdb-amd64:3.4.0.9
    container_name: data-watch-tdengine
    hostname: tdengine
    profiles:
      - infra
    environment:
      # taosd 必须能解析自己的 FQDN，否则启动即崩。固定 fqdn=tdengine，
      # 配合 hostname: tdengine（Docker 会把它写进 /etc/hosts 指向本容器 IP）。
      - TAOS_FQDN=tdengine
      - TAOS_QUERY_USE_MEMORY_POOL=0
      - TZ=Asia/Shanghai
    ports:
      - "6030:6030"
      - "6041:6041"
      - "6043:6043"
      - "6062:6060"
    volumes:
      - tdengine_data:/var/lib/taos
      # 服务端配置：日志保留 + 磁盘安全阀 + 降同步日志噪声（其余项用默认）
      - ./taos.cfg:/etc/taos/taos.cfg
      # 服务日志卷：供 backend 只读挂载，实现前端「数据库日志」查看页
      - tdengine_log:/var/log/taos
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: data-watch-backend:latest
    container_name: data-watch-backend
    env_file:
      - ./backend.env
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "8000:8000"
    volumes:
      - ../backend/logs:/app/logs
      - ../backend/exports:/app/exports
      - ../backend/cli-releases:/app/cli-releases:ro
      # 只读挂载 TDengine 服务日志卷，供「数据库日志」查看页 tail（需 compose 托管 TDengine）
      - tdengine_log:/tdengine-logs:ro
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: data-watch-frontend:latest
    container_name: data-watch-frontend
    depends_on:
      - backend
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  redis_data:
  tdengine_data:
  tdengine_log:
