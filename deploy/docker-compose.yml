services:
  redis:
    image: redis:latest
    container_name: data-watch-redis
    profiles:
      - infra
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  tdengine:
    image: tdengine/tsdb-amd64:3.4.0.9
    container_name: data-watch-tdengine
    profiles:
      - infra
    environment:
      - TAOS_QUERY_USE_MEMORY_POOL=0
      - TZ=Asia/Shanghai
    ports:
      - "6030:6030"
      - "6041:6041"
      - "6043:6043"
      - "6062:6060"
    volumes:
      - tdengine_data:/var/lib/taos
      # 服务端配置：日志保留 + 磁盘安全阀 + 降同步日志噪声（其余项用默认）
      - ./taos.cfg:/etc/taos/taos.cfg
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: data-watch-backend:latest
    container_name: data-watch-backend
    env_file:
      - ./backend.env
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "8000:8000"
    volumes:
      - ../backend/logs:/app/logs
      - ../backend/exports:/app/exports
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: data-watch-frontend:latest
    container_name: data-watch-frontend
    depends_on:
      - backend
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  redis_data:
  tdengine_data:
