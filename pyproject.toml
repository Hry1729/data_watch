[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "data-watch-cli"
dynamic = ["version"]
description = "DataWatch internal command-line client"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50,<51",
    "httpx>=0.27,<1",
    "jmespath>=1,<2",
    "keyring>=25,<26",
    "openpyxl>=3.1,<4",
    "packaging>=24,<27",
    "pymysql>=1.1,<2",
    # pywin32 没有 cp314t wheel，不能作为基础依赖。Windows 凭据库由 keyring 的 pywin32-ctypes 提供。
    "rich>=13.7,<15",
    "typer>=0.16,<1",
    "click>=8.1,<9",
    "websockets>=14,<18",
]

[project.scripts]
data-watch = "cli.main:main"

[tool.setuptools.dynamic]
version = {attr = "cli.version.CLI_VERSION"}

[tool.setuptools.packages.find]
include = ["cli*", "direct_read*"]
exclude = ["cli.tests*", "direct_read.tests*"]
